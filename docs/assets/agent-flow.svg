<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 386" width="880" height="386" role="img" aria-label="Eight steps from the farmer's question to a checked, spoken answer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How Mandi-Mausam decides</title>
<style>
 text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Noto Sans",sans-serif; }
 .title { font-size: 20px; font-weight: 700; fill: #0b0b0b; }
 .sub { font-size: 13px; fill: #52514e; }
 .lab { font-size: 14px; fill: #0b0b0b; }
 .lab-b { font-size: 14px; font-weight: 700; fill: #0b0b0b; }
 .val { font-size: 13px; font-weight: 600; fill: #0b0b0b; }
 .small { font-size: 12px; fill: #52514e; }
 .src { font-size: 11px; fill: #6b6a66; }
 .on-blue { font-size: 13px; font-weight: 700; fill: #ffffff; }
</style>
<rect x="0.5" y="0.5" width="879" height="385" rx="16" fill="#fcfcfb" stroke="#e6e4de"/>
<text x="32" y="44" class="title">How one question becomes one honest answer</text>
<text x="32" y="66" class="sub">The AI model decides which tool to call next and explains the result. Plain code does every rupee of maths.</text>
<rect x="32" y="82" width="830" height="22" rx="11" fill="#eef3fb"/>
<text x="447" y="97" text-anchor="middle" class="small">Sarvam-105B plans each step · every number it says must exist in the live data, or it is sent back to fix it</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6a66"/></marker></defs>
<path d="M224,153.0 H240" stroke="#6b6a66" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M438,153.0 H454" stroke="#6b6a66" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M652,153.0 H668" stroke="#6b6a66" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M768.0,192 V256" stroke="#6b6a66" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M670,297.0 H654" stroke="#6b6a66" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M456,297.0 H440" stroke="#6b6a66" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M242,297.0 H226" stroke="#6b6a66" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="32" y="118" width="188" height="70" rx="12" fill="#ffffff" stroke="#e6e4de" stroke-width="1"/>
<rect x="32" y="118" width="188" height="70" rx="12" fill="#2a78d6" opacity="0"><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;0.22;0;0" keyTimes="0;0.0546;0.0722;0.2000;1"/></rect>
<circle cx="54" cy="142" r="11" fill="#2a78d6"/><text x="54" y="146.5" text-anchor="middle" class="on-blue" style="font-size:12px">1</text>
<text x="72" y="147" class="lab-b">Farmer asks</text>
<text x="48" y="172" class="small">voice or text · EN, हिंदी, मराठी</text>
<rect x="246" y="118" width="188" height="70" rx="12" fill="#ffffff" stroke="#e6e4de" stroke-width="1"/>
<rect x="246" y="118" width="188" height="70" rx="12" fill="#2a78d6" opacity="0"><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;0.22;0;0" keyTimes="0;0.1794;0.1971;0.3249;1"/></rect>
<circle cx="268" cy="142" r="11" fill="#2a78d6"/><text x="268" y="146.5" text-anchor="middle" class="on-blue" style="font-size:12px">2</text>
<text x="286" y="147" class="lab-b">Find the village</text>
<text x="262" y="172" class="small">Open-Meteo · OSM</text>
<rect x="460" y="118" width="188" height="70" rx="12" fill="#ffffff" stroke="#e6e4de" stroke-width="1"/>
<rect x="460" y="118" width="188" height="70" rx="12" fill="#2a78d6" opacity="0"><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;0.22;0;0" keyTimes="0;0.3043;0.3220;0.4498;1"/></rect>
<circle cx="482" cy="142" r="11" fill="#2a78d6"/><text x="482" y="146.5" text-anchor="middle" class="on-blue" style="font-size:12px">3</text>
<text x="500" y="147" class="lab-b">7-day rain &amp; humidity</text>
<text x="476" y="172" class="small">Open-Meteo forecast</text>
<rect x="674" y="118" width="188" height="70" rx="12" fill="#ffffff" stroke="#e6e4de" stroke-width="1"/>
<rect x="674" y="118" width="188" height="70" rx="12" fill="#2a78d6" opacity="0"><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;0.22;0;0" keyTimes="0;0.4292;0.4469;0.5746;1"/></rect>
<circle cx="696" cy="142" r="11" fill="#2a78d6"/><text x="696" y="146.5" text-anchor="middle" class="on-blue" style="font-size:12px">4</text>
<text x="714" y="147" class="lab-b">Mandi prices today</text>
<text x="690" y="172" class="small">data.gov.in · Agmarknet</text>
<rect x="674" y="262" width="188" height="70" rx="12" fill="#ffffff" stroke="#e6e4de" stroke-width="1"/>
<rect x="674" y="262" width="188" height="70" rx="12" fill="#2a78d6" opacity="0"><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;0.22;0;0" keyTimes="0;0.5132;0.5309;0.6587;1"/></rect>
<circle cx="696" cy="286" r="11" fill="#2a78d6"/><text x="696" y="290.5" text-anchor="middle" class="on-blue" style="font-size:12px">5</text>
<text x="714" y="291" class="lab-b">Road distance</text>
<text x="690" y="316" class="small">OSRM · OSM roads</text>
<rect x="460" y="262" width="188" height="70" rx="12" fill="#ffffff" stroke="#e6e4de" stroke-width="1"/>
<rect x="460" y="262" width="188" height="70" rx="12" fill="#2a78d6" opacity="0"><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;0.22;0;0" keyTimes="0;0.6381;0.6558;0.7836;1"/></rect>
<circle cx="482" cy="286" r="11" fill="#2a78d6"/><text x="482" y="290.5" text-anchor="middle" class="on-blue" style="font-size:12px">6</text>
<text x="500" y="291" class="lab-b">Price after transport</text>
<text x="476" y="316" class="small">plain Python maths</text>
<rect x="246" y="262" width="188" height="70" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<rect x="246" y="262" width="188" height="70" rx="12" fill="#2a78d6" opacity="0"><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;0.22;0;0" keyTimes="0;0.7630;0.7807;0.9085;1"/></rect>
<circle cx="268" cy="286" r="11" fill="#2a78d6"/><text x="268" y="290.5" text-anchor="middle" class="on-blue" style="font-size:12px">7</text>
<text x="286" y="291" class="lab-b">Check every number</text>
<text x="262" y="316" class="small">grounding guard</text>
<rect x="32" y="262" width="188" height="70" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<rect x="32" y="262" width="188" height="70" rx="12" fill="#2a78d6" opacity="0"><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;0.22;0;0" keyTimes="0;0.8879;0.9056;0.9990;1"/></rect>
<circle cx="54" cy="286" r="11" fill="#2a78d6"/><text x="54" y="290.5" text-anchor="middle" class="on-blue" style="font-size:12px">8</text>
<text x="72" y="291" class="lab-b">Answer, out loud</text>
<text x="48" y="316" class="small">Sarvam-105B · Bulbul voice</text>
<circle r="7" fill="#2a78d6" stroke="#ffffff" stroke-width="2"><animateMotion dur="9.0s" repeatCount="indefinite" path="M126.0,153.0 L340.0,153.0 L554.0,153.0 L768.0,153.0 L768.0,297.0 L554.0,297.0 L340.0,297.0 L126.0,297.0" keyPoints="0;0;1;1" keyTimes="0;0.0556;0.8889;1" calcMode="linear"/></circle>
<text x="32" y="368" class="src">Steps 2-5 call live public APIs at question time. Step 6 is ordinary code, so the arithmetic cannot be hallucinated.</text>
</svg>
