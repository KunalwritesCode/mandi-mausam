<rect x="210" y="234" width="452.6" height="24" rx="4" fill="#d6d3cb"><animate attributeName="width" dur="1.56s" fill="freeze" values="0;0;452.6" keyTimes="0;0.359;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text x="672.6" y="251" class="val">₹26,001<animate attributeName="opacity" dur="1.96s" fill="freeze" values="0;0;1" keyTimes="0;0.745;1"/></text>
