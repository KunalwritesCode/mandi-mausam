<rect x="210" y="310" width="190.2" height="24" rx="4" fill="#d6d3cb"><animate attributeName="width" dur="1.80s" fill="freeze" values="0;0;190.2" keyTimes="0;0.444;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text x="410.2" y="327" class="val">₹10,925<animate attributeName="opacity" dur="2.20s" fill="freeze" values="0;0;1" keyTimes="0;0.773;1"/></text>
<text x="32" y="365" class="lab">Pulses</text>
<rect x="210" y="348" width="161.7" height="24" rx="4" fill="#d6d3cb"><animate attributeName="width" dur="1.92s" fill="freeze" values="0;0;161.7" keyTimes="0;0.479;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text x="381.7" y="365" class="val">₹9,289<animate attributeName="opacity" dur="2.32s" fill="freeze" values="0;0;1" keyTimes="0;0.784;1"/></text>
<text x="32" y="403" class="lab">Eggs</text>
<rect x="210" y="386" width="57.2" height="24" rx="4" fill="#d6d3cb"><animate attributeName="width" dur="2.04s" fill="freeze" values="0;0;57.2" keyTimes="0;0.510;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text x="277.2" y="403" class="val">₹3,287<animate attributeName="opacity" dur="2.44s" fill="freeze" values="0;0;1" keyTimes="0;0.795;1"/></text>
<text x="32" y="450" class="src">Source: Ministry of Food Processing Industries, Lok Sabha unstarred question 1773 (5 Dec 2024), citing the NABCONS 2022 study (reference years 2020-22).</text>
