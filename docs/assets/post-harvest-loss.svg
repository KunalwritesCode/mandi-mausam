<rect x="0.5" y="0.5" width="879" height="469" rx="16" fill="#fcfcfb" stroke="#e6e4de"/>
<text x="32" y="44" class="title">₹27,459 crore of vegetables is lost after harvest each year</text>
<text x="32" y="66" class="sub">Estimated value of post-harvest loss by category, ₹ crore. Onion alone accounts for ₹5,156 crore.</text>
<text x="32" y="109" class="lab">Livestock produce</text>
<rect x="210" y="92" width="520.0" height="24" rx="4" fill="#d6d3cb"><animate attributeName="width" dur="1.20s" fill="freeze" values="0;0;520.0" keyTimes="0;0.167;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text x="740.0" y="109" class="val">₹29,871<animate attributeName="opacity" dur="1.60s" fill="freeze" values="0;0;1" keyTimes="0;0.688;1"/></text>
<text x="32" y="147" class="lab">Fruits</text>
<rect x="210" y="130" width="514.3" height="24" rx="4" fill="#d6d3cb"><animate attributeName="width" dur="1.32s" fill="freeze" values="0;0;514.3" keyTimes="0;0.242;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text x="734.3" y="147" class="val">₹29,545<animate attributeName="opacity" dur="1.72s" fill="freeze" values="0;0;1" keyTimes="0;0.709;1"/></text>
<text x="32" y="185" class="lab-b">Vegetables</text>
<rect x="210" y="168" width="478.0" height="24" rx="4" fill="#2a78d6"><animate attributeName="width" dur="1.44s" fill="freeze" values="0;0;478.0" keyTimes="0;0.306;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text x="698.0" y="185" class="val">₹27,459<animate attributeName="opacity" dur="1.84s" fill="freeze" values="0;0;1" keyTimes="0;0.728;1"/></text>
<text x="48" y="218" class="small">of which onion</text>
<rect x="210" y="206" width="89.8" height="14" rx="3" fill="#1c5cab"><animate attributeName="width" dur="2.44s" fill="freeze" values="0;0;89.8" keyTimes="0;0.590;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text x="309.8" y="218" class="val">₹5,156<animate attributeName="opacity" dur="2.74s" fill="freeze" values="0;0;1" keyTimes="0;0.818;1"/></text>
