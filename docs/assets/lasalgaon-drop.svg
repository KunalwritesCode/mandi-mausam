<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 324" width="880" height="324" role="img" aria-label="Average onion price at Lasalgaon fell from 4,451 to 3,900 rupees a quintal between 1 and 6 October 2026" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lasalgaon onion price, 1 to 6 October 2026</title>
<style>
 text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Noto Sans",sans-serif; }
 .title { font-size: 20px; font-weight: 700; fill: #0b0b0b; }
 .sub { font-size: 13px; fill: #52514e; }
 .lab { font-size: 14px; fill: #0b0b0b; }
 .lab-b { font-size: 14px; font-weight: 700; fill: #0b0b0b; }
 .val { font-size: 13px; font-weight: 600; fill: #0b0b0b; }
 .small { font-size: 12px; fill: #52514e; }
 .src { font-size: 11px; fill: #6b6a66; }
 .on-blue { font-size: 13px; font-weight: 700; fill: #ffffff; }
</style>
<rect x="0.5" y="0.5" width="879" height="323" rx="16" fill="#fcfcfb" stroke="#e6e4de"/>
<text x="32" y="44" class="title">Five days, ₹551 a quintal: how fast onion prices move</text>
<text x="32" y="66" class="sub">Average price of summer onion at Lasalgaon APMC (Nashik), ₹ per quintal, October 2026</text>
<line x1="230" x2="650" y1="266.0" y2="266.0" stroke="#e6e4de" stroke-width="1"/>
<line x1="230" y1="143.9" x2="650" y2="247.2" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="432.5" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" dur="2s" fill="freeze" values="432.5;432.5;0" keyTimes="0;0.3;1"/></line>
<circle cx="230" cy="143.9" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="650" cy="247.2" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><animate attributeName="opacity" dur="2.30s" fill="freeze" values="0;0;1" keyTimes="0;0.870;1"/></circle>
<text x="230" y="127.9" text-anchor="middle" class="lab-b">₹4,451</text>
<text x="664" y="252.2" class="lab-b">₹3,900<animate attributeName="opacity" dur="2.50s" fill="freeze" values="0;0;1" keyTimes="0;0.800;1"/></text>
<text x="230" y="288.0" text-anchor="middle" class="small">1 Oct</text>
<text x="650" y="288.0" text-anchor="middle" class="small">6 Oct</text>
<g opacity="1"><animate attributeName="opacity" dur="2.80s" fill="freeze" values="0;0;1" keyTimes="0;0.821;1"/><text x="690" y="132" class="lab-b">−₹551 a quintal</text><text x="690" y="152" class="small">−12% in five days</text><text x="690" y="182" class="small">For 20 quintals, that is</text><text x="690" y="200" class="small">₹11,020 less (our calculation)</text></g>
<text x="32" y="306" class="src">Source: Free Press Journal, "Nashik: Egyptian Onions, Fresh Kharif Arrivals Put Pressure On Onion Prices", 6 Oct 2026.</text>
