<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Of three price sources and three AI models tested, data.gov.in and Sarvam-105B worked" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Data and model sources we tested</title>
<style>
 text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Noto Sans",sans-serif; }
 .title { font-size: 20px; font-weight: 700; fill: #0b0b0b; }
 .sub { font-size: 13px; fill: #52514e; }
 .lab { font-size: 14px; fill: #0b0b0b; }
 .lab-b { font-size: 14px; font-weight: 700; fill: #0b0b0b; }
 .val { font-size: 13px; font-weight: 600; fill: #0b0b0b; }
 .small { font-size: 12px; fill: #52514e; }
 .src { font-size: 11px; fill: #6b6a66; }
 .on-blue { font-size: 13px; font-weight: 700; fill: #ffffff; }
</style>
<rect x="0.5" y="0.5" width="879" height="429" rx="16" fill="#fcfcfb" stroke="#e6e4de"/>
<text x="32" y="44" class="title">Six doors we knocked on, and the two that opened</text>
<text x="32" y="66" class="sub">Every source was tested live from our laptop before we built on it (31 Oct - 1 Nov 2026)</text>
<text x="32" y="104" class="lab-b">Where today's prices come from</text>
<g opacity="1"><animate attributeName="opacity" dur="0.70s" fill="freeze" values="0;0;1" keyTimes="0;0.429;1"/><rect x="32" y="118" width="262" height="92" rx="12" fill="#ffffff" stroke="#e6e4de" stroke-width="1"/><text x="48" y="146" style="font-size:17px;font-weight:700;fill:#d03b3b">✗</text><text x="70" y="146" class="lab-b">Agmarknet 2.0 API</text><text x="48" y="172" class="small">Price report needs a captcha.</text><text x="48" y="190" class="small">We do not bypass captchas.</text><text x="280" y="146" text-anchor="end" class="small" style="font-weight:700">Rejected</text></g>
<g opacity="1"><animate attributeName="opacity" dur="1.05s" fill="freeze" values="0;0;1" keyTimes="0;0.619;1"/><rect x="309" y="118" width="262" height="92" rx="12" fill="#ffffff" stroke="#e6e4de" stroke-width="1"/><text x="325" y="146" style="font-size:17px;font-weight:700;fill:#d03b3b">✗</text><text x="347" y="146" class="lab-b">Community mirror</text><text x="325" y="172" class="small">Last synced 16 Oct 2026:</text><text x="325" y="190" class="small">16 days old on 1 Nov.</text><text x="557" y="146" text-anchor="end" class="small" style="font-weight:700">Rejected</text></g>
<g opacity="1"><animate attributeName="opacity" dur="1.40s" fill="freeze" values="0;0;1" keyTimes="0;0.714;1"/><rect x="586" y="118" width="262" height="92" rx="12" fill="#f1f9f1" stroke="#0ca30c" stroke-width="2"/><text x="602" y="146" style="font-size:17px;font-weight:700;fill:#0ca30c">✓</text><text x="624" y="146" class="lab-b">data.gov.in official API</text><text x="602" y="172" class="small">Feed updated 1 Nov, 11:30 AM;</text><text x="602" y="190" class="small">prices dated 1 Nov 2026.</text><text x="834" y="146" text-anchor="end" class="small" style="font-weight:700">Chosen</text></g>
<text x="32" y="254" class="lab-b">Which AI model answers</text>
<g opacity="1"><animate attributeName="opacity" dur="1.75s" fill="freeze" values="0;0;1" keyTimes="0;0.771;1"/><rect x="32" y="268" width="262" height="92" rx="12" fill="#ffffff" stroke="#e6e4de" stroke-width="1"/><text x="48" y="296" style="font-size:17px;font-weight:700;fill:#d03b3b">✗</text><text x="70" y="296" class="lab-b">Gemini (flash-latest)</text><text x="48" y="322" class="small">No reply within 40 s,</text><text x="48" y="340" class="small">on both API routes.</text><text x="280" y="296" text-anchor="end" class="small" style="font-weight:700">Rejected</text></g>
<g opacity="1"><animate attributeName="opacity" dur="2.10s" fill="freeze" values="0;0;1" keyTimes="0;0.810;1"/><rect x="309" y="268" width="262" height="92" rx="12" fill="#ffffff" stroke="#e6e4de" stroke-width="1"/><text x="325" y="296" style="font-size:17px;font-weight:700;fill:#d03b3b">✗</text><text x="347" y="296" class="lab-b">Gemini 2.5 Flash</text><text x="325" y="322" class="small">HTTP 404: no longer offered</text><text x="325" y="340" class="small">to new users.</text><text x="557" y="296" text-anchor="end" class="small" style="font-weight:700">Rejected</text></g>
<g opacity="1"><animate attributeName="opacity" dur="2.45s" fill="freeze" values="0;0;1" keyTimes="0;0.837;1"/><rect x="586" y="268" width="262" height="92" rx="12" fill="#f1f9f1" stroke="#0ca30c" stroke-width="2"/><text x="602" y="296" style="font-size:17px;font-weight:700;fill:#0ca30c">✓</text><text x="624" y="296" class="lab-b">Sarvam-105B</text><text x="602" y="322" class="small">Replied in 0.59 s with the</text><text x="602" y="340" class="small">right tool call for Lasalgaon.</text><text x="834" y="296" text-anchor="end" class="small" style="font-weight:700">Chosen</text></g>
<text x="32" y="412" class="src">Details and timings for each test are in the build log below.</text>
</svg>
