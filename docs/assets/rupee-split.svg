<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Farmers receive about 33 rupees of every 100 for tomato, 36 for onion and 37 for potato" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Farmer's share of the consumer rupee</title>
<style>
 text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Noto Sans",sans-serif; }
 .title { font-size: 20px; font-weight: 700; fill: #0b0b0b; }
 .sub { font-size: 13px; fill: #52514e; }
 .lab { font-size: 14px; fill: #0b0b0b; }
 .lab-b { font-size: 14px; font-weight: 700; fill: #0b0b0b; }
 .val { font-size: 13px; font-weight: 600; fill: #0b0b0b; }
 .small { font-size: 12px; fill: #52514e; }
 .src { font-size: 11px; fill: #6b6a66; }
 .on-blue { font-size: 13px; font-weight: 700; fill: #ffffff; }
</style>
<rect x="0.5" y="0.5" width="879" height="299" rx="16" fill="#fcfcfb" stroke="#e6e4de"/>
<text x="32" y="44" class="title">Of every ₹100 a shopper pays, about a third reaches the farmer</text>
<text x="32" y="66" class="sub">Farmer's share of the consumer rupee for India's three biggest vegetables</text>
<text x="32" y="119" class="lab-b">Tomato</text>
<rect x="379.7" y="96" width="460.3" height="36" rx="4" fill="#d6d3cb"><animate attributeName="opacity" dur="1.60s" fill="freeze" values="0;0;1" keyTimes="0;0.750;1"/></rect>
<rect x="150" y="96" width="227.7" height="36" rx="4" fill="#2a78d6"><animate attributeName="width" dur="1.30s" fill="freeze" values="0;0;227.7" keyTimes="0;0.231;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text x="162" y="119" class="on-blue">₹33 to the farmer<animate attributeName="opacity" dur="1.70s" fill="freeze" values="0;0;1" keyTimes="0;0.706;1"/></text>
<text x="391.7" y="119" class="val" style="fill:#52514e">₹67 to the rest of the chain<animate attributeName="opacity" dur="1.90s" fill="freeze" values="0;0;1" keyTimes="0;0.737;1"/></text>
<text x="32" y="175" class="lab-b">Onion</text>
<rect x="400.4" y="152" width="439.6" height="36" rx="4" fill="#d6d3cb"><animate attributeName="opacity" dur="1.85s" fill="freeze" values="0;0;1" keyTimes="0;0.784;1"/></rect>
<rect x="150" y="152" width="248.4" height="36" rx="4" fill="#2a78d6"><animate attributeName="width" dur="1.55s" fill="freeze" values="0;0;248.4" keyTimes="0;0.355;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text x="162" y="175" class="on-blue">₹36 to the farmer<animate attributeName="opacity" dur="1.95s" fill="freeze" values="0;0;1" keyTimes="0;0.744;1"/></text>
<text x="412.4" y="175" class="val" style="fill:#52514e">₹64 to the rest of the chain<animate attributeName="opacity" dur="2.15s" fill="freeze" values="0;0;1" keyTimes="0;0.767;1"/></text>
<text x="32" y="231" class="lab-b">Potato</text>
<rect x="407.3" y="208" width="432.7" height="36" rx="4" fill="#d6d3cb"><animate attributeName="opacity" dur="2.10s" fill="freeze" values="0;0;1" keyTimes="0;0.810;1"/></rect>
<rect x="150" y="208" width="255.3" height="36" rx="4" fill="#2a78d6"><animate attributeName="width" dur="1.80s" fill="freeze" values="0;0;255.3" keyTimes="0;0.444;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></rect>
<text x="162" y="231" class="on-blue">₹37 to the farmer<animate attributeName="opacity" dur="2.20s" fill="freeze" values="0;0;1" keyTimes="0;0.773;1"/></text>
<text x="419.3" y="231" class="val" style="fill:#52514e">₹63 to the rest of the chain<animate attributeName="opacity" dur="2.40s" fill="freeze" values="0;0;1" keyTimes="0;0.792;1"/></text>
<text x="32" y="282" class="src">Source: RBI Working Paper 08/2024, "Vegetables Inflation in India: A Study of Tomato, Onion and Potato" (estimates rounded).</text>
</svg>
