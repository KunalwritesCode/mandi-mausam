<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Illustrative example: a nearer mandi with a lower quote can leave the farmer more money after transport" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Price after transport, worked example</title>
<style>
 text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Noto Sans",sans-serif; }
 .title { font-size: 20px; font-weight: 700; fill: #0b0b0b; }
 .sub { font-size: 13px; fill: #52514e; }
 .lab { font-size: 14px; fill: #0b0b0b; }
 .lab-b { font-size: 14px; font-weight: 700; fill: #0b0b0b; }
 .val { font-size: 13px; font-weight: 600; fill: #0b0b0b; }
 .small { font-size: 12px; fill: #52514e; }
 .src { font-size: 11px; fill: #6b6a66; }
 .on-blue { font-size: 13px; font-weight: 700; fill: #ffffff; }
</style>
<rect x="0.5" y="0.5" width="879" height="359" rx="16" fill="#fcfcfb" stroke="#e6e4de"/>
<text x="32" y="44" class="title">The highest price is not always the most money</text>
<text x="32" y="66" class="sub">Worked example with round numbers (not market data): 10 quintals, transport ₹40 per km</text>
<text x="32" y="124" class="lab-b">Mandi A</text>
<text x="32" y="144" class="small">5 km away</text>
<rect x="230" y="104" width="507.0" height="34" rx="4" fill="#d6d3cb"><animate attributeName="width" dur="10.0s" repeatCount="indefinite" values="0;507.0;507.0;507.0;507.0;0" keyTimes="0;0.12;0.30;0.42;0.94;1"/></rect>
<rect x="230" y="104" width="504.4" height="34" rx="4" fill="#2a78d6"><animate attributeName="width" dur="10.0s" repeatCount="indefinite" values="0;507.0;507.0;504.4;504.4;0" keyTimes="0;0.12;0.30;0.42;0.94;1"/></rect>
<text x="749.0" y="126" class="val" opacity="0">quoted ₹3,900<animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.10;0.14;0.28;0.30;1"/></text>
<text x="749.0" y="126" class="val" opacity="0">you keep ₹3,880<animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.42;0.46;0.94;1"/></text>
<text x="230" y="158" class="small" opacity="0">transport ₹40 × 5 km ÷ 10 quintals = ₹20 a quintal<animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.42;0.46;0.94;1"/></text>
<text x="32" y="210" class="lab-b">Mandi B</text>
<text x="32" y="230" class="small">120 km away</text>
<rect x="230" y="190" width="520.0" height="34" rx="4" fill="#d6d3cb"><animate attributeName="width" dur="10.0s" repeatCount="indefinite" values="0;520.0;520.0;520.0;520.0;0" keyTimes="0;0.12;0.30;0.42;0.94;1"/></rect>
<rect x="230" y="190" width="457.6" height="34" rx="4" fill="#2a78d6"><animate attributeName="width" dur="10.0s" repeatCount="indefinite" values="0;520.0;520.0;457.6;457.6;0" keyTimes="0;0.12;0.30;0.42;0.94;1"/></rect>
<text x="762.0" y="212" class="val" opacity="0">quoted ₹4,000<animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.10;0.14;0.28;0.30;1"/></text>
<text x="762.0" y="212" class="val" opacity="0">you keep ₹3,520<animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.42;0.46;0.94;1"/></text>
<text x="230" y="244" class="small" opacity="0">transport ₹40 × 120 km ÷ 10 quintals = ₹480 a quintal<animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.42;0.46;0.94;1"/></text>
<g opacity="0"><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.52;0.56;0.94;1"/><rect x="32" y="282" width="816" height="34" rx="8" fill="#eaf6ea"/><text x="48" y="304" class="lab-b">✓ Mandi A leaves you ₹3,600 more for 10 quintals, even though B quotes ₹100 more.</text></g>
<text x="32" y="342" class="src">Mandi-Mausam does exactly this with live prices, real road distances and the transport rate the farmer gives.</text>
</svg>
