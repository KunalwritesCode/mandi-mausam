services:
  - type: web
    name: mandi-mausam
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # AI model: Sarvam-105B through its OpenAI-compatible API (key = SARVAM_API_KEY below)
      - key: LLM_BASE_URL
        value: https://api.sarvam.ai/v1
      - key: LLM_MODEL
        value: sarvam-105b
      - key: SARVAM_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
